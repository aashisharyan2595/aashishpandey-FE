<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Submissions</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070916;--panel:#0e1230;--panel2:#141a40;--line:rgba(244,239,230,.12);--ink:#f4efe6;--mute:#aaa4b8;--amber:#f5b867;--green:#6fd6a8;--red:#ff8f7a;--blue:#8db4ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Geist,system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--amber)}
.hide{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:20px clamp(14px,3vw,32px) 80px}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login form{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:24px;letter-spacing:-.03em}
.sub{margin:0;color:var(--mute);font-size:14px}
input,select,textarea{background:#0a0e26;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--amber)}
.btn.pri{background:var(--amber);color:#1a1420;border-color:var(--amber)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--red);font-size:14px;min-height:20px}
/* header + chips */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:130px;cursor:pointer;text-align:left}
.chip b{display:block;font-size:24px;letter-spacing:-.03em}
.chip span{font-size:12.5px;color:var(--mute)}
.chip.warn b{color:var(--red)}
/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1 1 220px}
.bar input[type=date]{width:150px}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:44px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:5;min-width:190px}
.menu .pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer}
.menu .pop button:hover{background:rgba(245,184,103,.12)}
/* table */
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font:500 11px 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(245,184,103,.06)}
tbody tr:last-child td{border-bottom:0}
td.n{font-weight:600}
td small{display:block;color:var(--mute);font-weight:400}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.s-new{color:var(--amber);border-color:var(--amber)}.s-replied,.s-subscribed{color:var(--green);border-color:var(--green)}
.s-spam,.m-failed{color:var(--red);border-color:var(--red)}.s-archived,.s-unsubscribed{color:var(--mute)}.s-pending{color:var(--blue);border-color:var(--blue)}
.m-sent{color:var(--green);border-color:rgba(111,214,168,.4)}
.empty{padding:48px 20px;text-align:center;color:var(--mute)}
.more{display:flex;justify-content:center;padding:14px}
/* detail drawer */
#drawer{position:fixed;inset:0;background:rgba(3,5,16,.6);z-index:20;display:flex;justify-content:flex-end}
#drawer .sheet{width:min(560px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:14.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
.msg{white-space:pre-wrap;background:#0a0e26;border-left:3px solid var(--amber);border-radius:8px;padding:12px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px}
@media(max-width:760px){th.h-m,td.c-m{display:none}}
</style>
</head>
<body>
<section id="login" class="hide">
  <form id="lf">
    <h1>Admin</h1>
    <p class="sub">Submissions from aashishpandey.com. Everything is saved here before any email is sent.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
    <button class="btn pri" type="submit">Sign in</button>
    <div class="err" id="lerr" role="alert"></div>
  </form>
</section>

<main id="app" class="wrap hide">
  <header class="top">
    <div><h1>Submissions</h1><p class="sub">Briefs from the forms and newsletter sign-ups. Times are IST.</p></div>
    <button class="btn" id="out">Sign out</button>
  </header>
  <div class="chips" id="chips"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search name, email, company, message">
    <select id="type"><option value="brief">Briefs</option><option value="subscriber">Subscribers</option><option value="all">Everything</option></select>
    <select id="status"><option value="all">Any status</option><option value="new">New</option><option value="replied">Replied</option><option value="spam">Spam</option><option value="archived">Archived</option><option value="pending">Pending</option><option value="subscribed">Subscribed</option><option value="unsubscribed">Unsubscribed</option><option value="mailfail">Email failed</option></select>
    <input type="date" id="from" aria-label="From date"><input type="date" id="to" aria-label="To date">
    <div class="menu"><button class="btn pri" id="exp">Export</button><div class="pop hide" id="expPop"><button data-f="xlsx">Excel (.xlsx)</button><button data-f="csv">CSV</button><button data-f="json">JSON</button></div></div>
    <button class="btn danger" id="delSel" disabled>Delete selected</button>
  </div>
  <div class="tbl">
    <table>
      <thead><tr><th><input type="checkbox" id="all" aria-label="Select all"></th><th>Received</th><th>Who</th><th class="h-m">Looking for</th><th class="h-m">From</th><th>Status</th><th class="h-m">Email</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty hide" id="empty">Nothing matches.</div>
  </div>
  <div class="more"><button class="btn hide" id="more">Load more</button></div>
</main>

<div id="drawer" class="hide"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)}, items=[], total=0, sel={}, PAGE=200;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ist(ms){return new Date(ms).toLocaleString('en-GB',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}
function api(a,opt,qs){return fetch('/api/kd2ozfuew9n4uaciyl1j?a='+a+(qs||''),opt).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(r.status===401&&a!=='login'){show(false)}return{ok:r.ok,status:r.status,j:j}})})}
function post(a,body){return api(a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})}
function show(on){$('app').classList.toggle('hide',!on);$('login').classList.toggle('hide',on)}
function qs(extra){var p=new URLSearchParams();[['q','q'],['type','type'],['status','status'],['from','from'],['to','to']].forEach(function(k){var v=$(k[0]).value;if(v&&v!=='all')p.set(k[1],v);else if(k[1]==='type'||k[1]==='status')p.set(k[1],'all')});for(var k in (extra||{}))p.set(k,extra[k]);return '&'+p.toString()}

function load(append){
  var off=append?items.length:0;
  return api('list',null,qs({offset:off,limit:PAGE})).then(function(x){
    if(!x.ok){if(x.status===503)$('lerr').textContent=x.j.error;return}
    items=append?items.concat(x.j.items):x.j.items;total=x.j.total;drawChips(x.j.counts);draw();
  });
}
function drawChips(c){
  var defs=[['New briefs',c.newBriefs,function(){$('type').value='brief';$('status').value='new';load()}],['All briefs',c.brief,function(){$('type').value='brief';$('status').value='all';load()}],['Subscribers',c.subscriber,function(){$('type').value='subscriber';$('status').value='all';load()}],['Email failures',c.mailfail,function(){$('type').value='all';$('status').value='mailfail';load()},c.mailfail>0]];
  $('chips').innerHTML='';
  defs.forEach(function(d){var b=document.createElement('button');b.className='chip'+(d[4]?' warn':'');b.innerHTML='<b>'+d[1]+'</b><span>'+esc(d[0])+'</span>';b.onclick=d[2];$('chips').appendChild(b)});
}
function mailPill(r){var m=r.mail||{};if(r.type!=='brief')return m.user?'<span class="pill m-'+m.user+'">'+m.user+'</span>':'';var f=m.admin==='failed'||m.user==='failed';return f?'<span class="pill m-failed">failed</span>':(m.admin==='sent'?'<span class="pill m-sent">sent</span>':'<span class="pill">unknown</span>')}
function draw(){
  var tb=$('rows');tb.innerHTML='';
  items.forEach(function(r){
    var tr=document.createElement('tr');
    tr.innerHTML='<td><input type="checkbox" '+(sel[r.id]?'checked':'')+' aria-label="Select"></td><td>'+esc(ist(r.created))+'</td><td class="n">'+esc(r.name||r.email)+'<small>'+esc(r.name?r.email:'')+(r.company?' · '+esc(r.company):'')+'</small></td><td class="c-m">'+esc(r.service||'')+'<small>'+esc([r.budget,r.timeline].filter(Boolean).join(' · '))+'</small></td><td class="c-m">'+esc(r.source||r.page||'')+'</td><td><span class="pill s-'+esc(r.status)+'">'+esc(r.status)+'</span></td><td class="c-m">'+mailPill(r)+'</td>';
    tr.onclick=function(e){if(e.target.type==='checkbox'){sel[r.id]=e.target.checked;selUI();return}open(r)};
    tb.appendChild(tr);
  });
  $('empty').classList.toggle('hide',items.length>0);
  $('more').classList.toggle('hide',items.length>=total);
  $('more').textContent='Load more ('+(total-items.length)+' left)';
  selUI();
}
function selIds(){return Object.keys(sel).filter(function(k){return sel[k]})}
function selUI(){var n=selIds().length;$('delSel').disabled=!n;$('delSel').textContent=n?'Delete '+n+' selected':'Delete selected';$('all').checked=items.length>0&&items.every(function(r){return sel[r.id]})}

function open(r){
  var m=r.mail||{}, s=$('sheet');
  var kv=[['Received',ist(r.created)],['Type',r.type],['Name',r.name],['Email','<a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a>'],['Company',r.company],['Website',r.website_url?'<a href="'+esc(/^https?:/i.test(r.website_url)?r.website_url:'https://'+r.website_url)+'" target="_blank" rel="noopener">'+esc(r.website_url)+'</a>':''],['Looking for',r.service],['Budget',r.budget],['Timeline',r.timeline],['Came from',r.source],['Page',r.page],['Referrer',r.ref]].filter(function(x){return x[1]});
  s.innerHTML='<div class="row" style="justify-content:space-between"><h1 style="font-size:20px">'+esc(r.name||r.email)+'</h1><button class="btn" id="x">Close</button></div>'
   +'<div class="row"><span class="pill s-'+esc(r.status)+'">'+esc(r.status)+'</span>'+(r.type==='brief'?'<span class="pill m-'+(m.admin==='failed'?'failed':m.admin==='sent'?'sent':'')+'">alert '+esc(m.admin||'unknown')+'</span><span class="pill m-'+(m.user==='failed'?'failed':m.user==='sent'?'sent':'')+'">confirmation '+esc(m.user||'unknown')+'</span>':'')+'</div>'
   +'<dl class="kv">'+kv.map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+(x[1].indexOf('<a ')===0?x[1]:esc(x[1]))+'</dd>'}).join('')+'</dl>'
   +(r.message?'<div class="msg">'+esc(r.message)+'</div>':'')
   +((m.adminError||m.userError)?'<div class="err">'+esc(m.adminError||m.userError)+'</div>':'')
   +'<label class="sub">Private note<textarea id="note" rows="3" style="width:100%;margin-top:6px">'+esc(r.note||'')+'</textarea></label>'
   +'<div class="row">'+(r.type==='brief'?['new','replied','spam','archived']:['pending','subscribed','unsubscribed']).map(function(st){return '<button class="btn" data-st="'+st+'">Mark '+st+'</button>'}).join('')+'<button class="btn pri" id="sv">Save note</button></div>'
   +(r.type==='brief'?'<div class="row"><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="mailto:'+esc(r.email)+'?subject='+encodeURIComponent('Re: your brief')+'">Reply</a><button class="btn" id="ra">Resend alert to me</button><button class="btn" id="ru">Resend confirmation to them</button></div>':'')
   +'<div class="row"><button class="btn danger" id="dl">Delete</button></div><div class="err" id="derr"></div>';
  $('drawer').classList.remove('hide');
  $('x').onclick=close;
  s.querySelectorAll('[data-st]').forEach(function(b){b.onclick=function(){patch(r,{status:b.getAttribute('data-st')})}});
  $('sv').onclick=function(){patch(r,{note:$('note').value})};
  if($('ra')){$('ra').onclick=function(){resend(r,'admin',this)};$('ru').onclick=function(){resend(r,'user',this)}}
  $('dl').onclick=function(){if(confirm('Delete this record for good?'))post('delete',{ids:[r.id]}).then(function(){close();load()})};
}
function close(){$('drawer').classList.add('hide')}
function patch(r,p){post('update',Object.assign({id:r.id},p)).then(function(x){if(x.ok){Object.assign(r,x.j.item);draw();open(r);load()}else $('derr').textContent=x.j.error||'Could not save.'})}
function resend(r,which,btn){btn.disabled=true;btn.textContent='Sending';post('resend',{id:r.id,which:which}).then(function(x){if(x.ok){load().then(function(){var f=items.find(function(i){return i.id===r.id});if(f)open(f)})}else{btn.disabled=false;btn.textContent='Try again';$('derr').textContent=x.j.error||'Could not send.'}})}

$('lf').onsubmit=function(e){e.preventDefault();$('lerr').textContent='';post('login',{password:$('pw').value}).then(function(x){if(x.ok){$('pw').value='';show(true);load()}else $('lerr').textContent=x.j.error||'Could not sign in.'})};
$('out').onclick=function(){post('logout').then(function(){show(false)})};
$('more').onclick=function(){load(true)};
$('all').onchange=function(){items.forEach(function(r){sel[r.id]=$('all').checked});draw()};
$('delSel').onclick=function(){var ids=selIds();if(ids.length&&confirm('Delete '+ids.length+' record(s) for good?'))post('delete',{ids:ids}).then(function(){sel={};load()})};
$('exp').onclick=function(e){e.stopPropagation();$('expPop').classList.toggle('hide')};
document.addEventListener('click',function(){$('expPop').classList.add('hide')});
$('expPop').onclick=function(e){var f=e.target.getAttribute&&e.target.getAttribute('data-f');if(!f)return;var ids=selIds();location.href='/api/kd2ozfuew9n4uaciyl1j?a=export&format='+f+(ids.length?'&ids='+encodeURIComponent(ids.join(',')):qs())};
var t;['q','type','status','from','to'].forEach(function(id){$(id).addEventListener(id==='q'?'input':'change',function(){clearTimeout(t);t=setTimeout(function(){sel={};load()},id==='q'?250:0)})});
$('drawer').onclick=function(e){if(e.target===$('drawer'))close()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
api('me').then(function(x){if(x.ok){show(true);load()}else{show(false);if(x.status===503)$('lerr').textContent=x.j.error}});
})();
</script>
</body>
</html>
